apiVersion: v1
kind: ServiceAccount
metadata:
  name: hazelcast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hazelcast-cluster-role
rules:
  - apiGroups: ["", "apps"]
    resources: ["endpoints", "pods", "nodes", "services", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hazelcast-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: hazelcast
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hazelcast-cluster-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hazelcast-config
data:
  hazelcast.yaml: |
    hazelcast:
      cluster-name: dev
      network:
        port:
          port: 5701
          auto-increment: false
        join:
          multicast:
            enabled: false
          tcp-ip:
            enabled: false
          kubernetes:
            enabled: true
            service-name: hazelcast
            resolve-not-ready-addresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: hazelcast
  ports:
    - name: hazelcast
      port: 5701
      targetPort: hazelcast
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-client
spec:
  selector:
    app: hazelcast
  ports:
    - name: hazelcast
      port: 5701
      targetPort: hazelcast
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hazelcast
spec:
  serviceName: hazelcast
  replicas: 3
  selector:
    matchLabels:
      app: hazelcast
  template:
    metadata:
      labels:
        app: hazelcast
    spec:
      serviceAccountName: hazelcast
      containers:
        - name: hazelcast
          image: hazelcast/hazelcast:5.4
          env:
            - name: JAVA_OPTS
              value: "-Dhazelcast.config=/opt/hazelcast/config_user/hazelcast.yaml"
          ports:
            - name: hazelcast
              containerPort: 5701
          readinessProbe:
            tcpSocket:
              port: hazelcast
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: hazelcast
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: hazelcast-config
              mountPath: /opt/hazelcast/config_user
      volumes:
        - name: hazelcast-config
          configMap:
            name: hazelcast-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-center
  template:
    metadata:
      labels:
        app: management-center
    spec:
      containers:
        - name: management-center
          image: hazelcast/management-center:5.4.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MC_DEFAULT_CLUSTER
              value: dev
            - name: MC_DEFAULT_CLUSTER_MEMBERS
              value: hazelcast-client:5701
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: management-center
spec:
  selector:
    app: management-center
  ports:
    - name: http
      port: 8080
      targetPort: http
