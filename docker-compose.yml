services:
  config-server:
    build: ./config-server
    ports:
      - "8003:8003"

  # --- Hazelcast cluster (3 nodes) ---
  hz1:
    image: hazelcast/hazelcast:5.4
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    ports:
      - "5701:5701"

  hz2:
    image: hazelcast/hazelcast:5.4
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    ports:
      - "5702:5701"

  hz3:
    image: hazelcast/hazelcast:5.4
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    ports:
      - "5703:5701"

  # --- Hazelcast Management Center ---
  management-center:
    image: hazelcast/management-center:5.4.1
    hostname: management-center
    ports:
      - "8080:8080"
    environment:
      MC_DEFAULT_CLUSTER: dev
      MC_DEFAULT_CLUSTER_MEMBERS: "hz1:5701,hz2:5701,hz3:5701"
    depends_on:
      - hz1
      - hz2
      - hz3

  # --- PostgreSQL ---
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
      POSTGRES_DB: counter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter"]
      interval: 3s
      timeout: 3s
      retries: 10

  # --- Logging service (3 instances) ---
  logging-service-1:
    build: ./logging-service
    environment:
      CONFIG_SERVER_URL: "http://config-server:8003"
      SERVICE_URL: "http://logging-service-1:8001"
      HZ_ADDRESSES: "hz1:5701,hz2:5701,hz3:5701"
    depends_on:
      - config-server
      - hz1
      - hz2
      - hz3

  logging-service-2:
    build: ./logging-service
    environment:
      CONFIG_SERVER_URL: "http://config-server:8003"
      SERVICE_URL: "http://logging-service-2:8001"
      HZ_ADDRESSES: "hz1:5701,hz2:5701,hz3:5701"
    depends_on:
      - config-server
      - hz1
      - hz2
      - hz3

  logging-service-3:
    build: ./logging-service
    environment:
      CONFIG_SERVER_URL: "http://config-server:8003"
      SERVICE_URL: "http://logging-service-3:8001"
      HZ_ADDRESSES: "hz1:5701,hz2:5701,hz3:5701"
    depends_on:
      - config-server
      - hz1
      - hz2
      - hz3

  # --- Counter service ---
  counter-service:
    build: ./counter-service
    ports:
      - "8002:8002"
    environment:
      CONFIG_SERVER_URL: "http://config-server:8003"
      SERVICE_URL: "http://counter-service:8002"
      DATABASE_URL: "postgresql://counter:counter@postgres:5432/counter"
      HZ_ADDRESSES: "hz1:5701,hz2:5701,hz3:5701"
    depends_on:
      config-server:
        condition: service_started
      hz1:
        condition: service_started
      hz2:
        condition: service_started
      hz3:
        condition: service_started
      postgres:
        condition: service_healthy

  # --- Facade service ---
  facade-service:
    build: ./facade-service
    ports:
      - "8000:8000"
    environment:
      CONFIG_SERVER_URL: "http://config-server:8003"
      SERVICE_URL: "http://facade-service:8000"
      HZ_ADDRESSES: "hz1:5701,hz2:5701,hz3:5701"
      HTTP_TIMEOUT_S: "5"
    depends_on:
      - config-server
      - hz1
      - hz2
      - hz3
      - logging-service-1
      - logging-service-2
      - logging-service-3
      - counter-service

volumes:
  pgdata:
